<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>404 - Route Not Found | Stackly Logistics</title>
  <meta name="description" content="The freight route or page you are attempting to access is currently unavailable or has been archived by Stackly Logistics.">
  <link rel="stylesheet" href="css/style.css">
  <style>
    html, body {
      height: 100vh;
      max-height: 100vh;
      overflow: hidden;
      margin: 0;
      padding: 0;
      background-color: var(--bg-surface, #ffffff);
    }
    .fixed-404-container {
      height: 100vh;
      max-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      text-align: center;
      padding: 24px;
      box-sizing: border-box;
      overflow: hidden;
    }
  </style>
</head>
<body class="error-page-body">
  <!-- Pure CSS Loader -->
  <div id="site-loader" aria-live="polite">
    <div class="loader-brand">
      <img src="assets/images/logo.webp" alt="Stackly Logistics Logo" class="loader-logo-img">
    </div>
    <div class="loader-spinner"></div>
    <div class="loader-text">Verifying Route Coordinates...</div>
  </div>

  <main>
    <!-- SINGLE FIXED SECTION WITH ONLY 404 MESSAGE, GO BACK & HOME PAGE BUTTONS -->
    <section class="error-page-wrapper fixed-404-container">
      <div class="error-content-box" style="max-width: 640px; margin: 0 auto;">
        <div class="error-glitch-number">404</div>
        <h1 class="error-title">Freight Route Not Found</h1>
        <p class="error-desc" style="margin-bottom: 32px;">
          The logistics pathway, operational waybill reference, or requested system endpoint does not exist or has been rerouted by Stackly Central Dispatch.
        </p>
        <div class="error-quick-links" style="display: flex; justify-content: center; gap: 16px; flex-wrap: wrap;">
          <!-- Swapped button positions: Go Back button first, then Home page button -->
          <button class="btn btn-secondary btn-lg btn-back" data-action="go-back" type="button" style="padding: 12px 28px; border-radius: 6px; display: inline-flex; align-items: center; gap: 8px;">
            <svg fill="none" viewBox="0 0 24 24" stroke="currentColor" width="18" height="18"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M10 19l-7-7m0 0l7-7m-7 7h18"/></svg>
            Go Back
          </button>
          <a href="index.html" class="btn btn-primary btn-lg" style="padding: 12px 28px; border-radius: 6px;">Home page</a>
        </div>
      </div>
    </section>
  </main>

  <script src="js/main.js"></script>
</body>
</html>
